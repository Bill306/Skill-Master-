    priority: 2

# === Category Definitions ===
categories:
  - name: LLM & Foundation Models
    keywords: [llm, gpt, claude, gemini, llama, model, foundation, language model, transformer, training, fine-tuning, benchmark]
  - name: Research & Papers
    keywords: [paper, arxiv, research, study, findings, breakthrough, novel, approach, algorithm, dataset]
  - name: Industry & Business
    keywords: [funding, acquisition, partnership, valuation, revenue, startup, enterprise, market, investment, ipo]
  - name: Products & Tools
    keywords: [launch, release, api, sdk, tool, platform, feature, update, developer, integration]
  - name: Policy & Regulation
    keywords: [regulation, policy, safety, ethics, governance, legislation, ban, compliance, eu, act, law]
  - name: Open Source
    keywords: [open-source, github, community, fork, license, weights, model release, free, self-hosted]
  - name: Applications
    keywords: [healthcare, education, finance, manufacturing, autonomous, robotics, agent, workflow, deployment]

# === Settings ===
settings:
  # Maximum age of articles to include (in hours)
  max_age_hours: 24
  # Request timeout in seconds
  request_timeout: 15
  # Maximum articles per feed
  max_per_feed: 10
  # User agent for HTTP requests
  user_agent: "AI-News-Digest/1.0 (RSS Reader)"
  # Similarity threshold for deduplication (0-1, higher = stricter)
  dedup_threshold: 0.6
