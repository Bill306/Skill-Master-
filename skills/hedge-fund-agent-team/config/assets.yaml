# === Risk Parameters ===
risk_params:
  max_position_size: 0.10       # 10% max per position
  max_sector_exposure: 0.30     # 30% max per sector
  max_single_country: 0.50      # 50% max per country
  max_drawdown_threshold: 0.15  # 15% portfolio drawdown triggers review
  var_confidence: 0.95          # 95% VaR confidence level
  var_horizon_days: 1           # 1-day VaR
  stop_loss_default: 0.07       # 7% default stop-loss
  take_profit_default: 0.15     # 15% default take-profit
  correlation_warning: 0.80     # Warn if pair correlation > 0.8
