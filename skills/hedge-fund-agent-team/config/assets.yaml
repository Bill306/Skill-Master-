# Hedge Fund Agent Team — Asset Universe & Data Source Configuration

# === Data Sources ===
data_sources:
  yahoo_finance:
    enabled: true
    # No API key needed
    rate_limit: 2  # seconds between requests
    capabilities: [prices, fundamentals, options, etf_flows]

  longbridge:
    enabled: true
    # Requires env vars: LONGPORT_APP_KEY, LONGPORT_APP_SECRET, LONGPORT_ACCESS_TOKEN
    # Get from: https://open.longportapp.com/
    markets: [US, HK, CN]
    capabilities: [realtime_quotes, fundamentals, broker_queue, capital_flow]

  tradingview:
    enabled: true
    # No API key needed (tradingview-ta library)
    capabilities: [technical_indicators, screener, recommendations]

# === Asset Universe ===
